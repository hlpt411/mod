name: Build Minecraft Mod

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle Wrapper if missing
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "⚠️ gradlew not found. Downloading Gradle 8.8 to generate wrapper..."
            wget -q https://services.gradle.org/distributions/gradle-8.8-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/
            /tmp/gradle-8.8/bin/gradle wrapper --gradle-version 8.8
            chmod +x ./gradlew
            echo "✅ Wrapper generated."
          else
            chmod +x ./gradlew
            echo "✅ gradlew found and permission granted."
          fi

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload Artifact (.jar file)
        uses: actions/upload-artifact@v4
        with:
          name: mod-build-${{ github.sha }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
